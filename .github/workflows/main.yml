name: Build Wasm Notepad APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-installed Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Restore Fixed Signing Keystore from Cache
        uses: actions/cache@v4
        with:
          path: ~/.android/mazwd_fixed.keystore
          key: mazwd-fixed-signing-keystore-permanent-v1

      - name: Ensure Fixed Signing Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/mazwd_fixed.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/mazwd_fixed.keystore \
              -alias mazwd_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mazwd123456 \
              -keypass mazwd123456 \
              -dname "CN=Wasm Notepad, OU=Mobile, O=Mazwd, L=Riyadh, S=Riyadh, C=SA"
          fi

      - name: Create Android Project Skeleton & Vector Drawables
        run: |
          mkdir -p app/src/main/java/com/mazwd/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/font
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          rootProject.name = "WasmNotepad"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "com.mazwd.app"
              compileSdk 34

              defaultConfig {
                  applicationId "com.mazwd.app"
                  minSdk 27
                  targetSdk 34
                  versionCode 271
                  versionName "2.7.1"
              }

              signingConfigs {
                  release {
                      storeFile file("${System.getProperty('user.home')}/.android/mazwd_fixed.keystore")
                      storePassword "mazwd123456"
                      keyAlias "mazwd_key"
                      keyPassword "mazwd123456"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mazwd.app">

              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:label="وسم"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # أيقونة التطبيق الخارجية الفاخرة (app_icon.xml)
          cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#1E3A8A"
                  android:pathData="M18,16h72c4.4,0 8,3.6 8,8v60c0,4.4 -3.6,8 -8,8H18c-4.4,0 -8,-3.6 -8,-8V24C10,19.6 13.6,16 18,16z" />
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M18,16h72c4.4,0 8,3.6 8,8v8H10v-8C10,19.6 13.6,16 18,16z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,44h44v3.5H24zM24,56h38v3.5H24zM24,68h30v3.5H24z" />
              <path
                  android:fillColor="#FBBF24"
                  android:pathData="M78,38l8,8l-24,24l-10,2l2,-10z" />
              <path
                  android:fillColor="#FDE68A"
                  android:pathData="M80,36l6,6l-3,3l-6,-6z" />
          </vector>
          EOF

          # توليد الأيقونات المتجهية الـ 13 لأدوات التحرير وزر القفز السريع
          python3 - << 'EOF'
          import os
          icons = {
              "ic_undo": "M12.5,8c-2.65,0 -5.05,0.99 -6.9,2.6L2,7v9h9l-3.62,-3.62c1.39,-1.16 3.16,-1.88 5.12,-1.88 3.54,0 6.55,2.31 7.6,5.5l2.37,-0.78C21.08,11.03 17.15,8 12.5,8z",
              "ic_redo": "M18.4,10.6C16.55,8.99 14.15,8 11.5,8c-4.65,0 -8.58,3.03 -9.96,7.22L3.9,16c1.05,-3.19 4.05,-5.5 7.6,-5.5 1.95,0 3.73,0.72 5.12,1.88L13,16h9V7l-3.6,3.6z",
              "ic_copy": "M16,1H4c-1.1,0 -2,0.9 -2,2v14h2V3h12V1zm3,4H8c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h11c1.1,0 2,-0.9 2,-2V7c0,-1.1 -0.9,-2 -2,-2zm0,16H8V7h11v14z",
              "ic_paste": "M19,2h-4.18C14.4,0.84 13.3,0 12,0c-1.3,0 -2.4,0.84 -2.82,2H5c-1.1,0 -2,0.9 -2,2v16c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2V4c0,-1.1 -0.9,-2 -2,-2zm-7,0c0.55,0 1,0.45 1,1s-0.45,1 -1,1 -1,-0.45 -1,-1 0.45,-1 1,-1zm7,18H5V4h2v3h10V4h2v16z",
              "ic_select_all": "M3,5h2V3c-1.1,0 -2,0.9 -2,2zm0,8h2v-2H3v2zm4,8h2v-2H7v2zM3,9h2V7H3v2zm10,-6h-2v2h2V3zm6,0v2h2c0,-1.1 -0.9,-2 -2,-2zM5,21v-2H3c0,1.1 0.9,2 2,2zm-2,-4h2v-2H3v2zM9,3H7v2h2V3zm2,18h2v-2h-2v2zm8,-8h2v-2h-2v2zm0,8c1.1,0 2,-0.9 2,-2h-2v2zm0,-12h2V7h-2v2zm0,8h2v-2h-2v2zm-4,4h2v-2h-2v2zm0,-16h2V3h-2v2zM7,17h10V7H7v10zm2,-8h6v6H9V9z",
              "ic_auto_format": "M7.5,5.6L10,7 8.6,4.5 10,2 7.5,3.4 5,2l1.4,2.5L5,7zm12,9.8L17,14l1.4,2.5L17,19l2.5,-1.4L22,19l-1.4,-2.5L22,14zM22,2l-2.5,1.4L17,2l1.4,2.5L17,7l2.5,-1.4L22,7l-1.4,-2.5zm-7.63,5.29c-0.39,-0.39 -1.02,-0.39 -1.41,0L1.29,18.96c-0.39,0.39 -0.39,1.02 0,1.41l2.34,2.34c0.39,0.39 1.02,0.39 1.41,0L16.7,11.05c0.39,-0.39 0.39,-1.02 0,-1.41l-2.33,-2.35z",
              "ic_signature": "M3,17.25V21h3.75L17.81,9.94l-3.75,-3.75L3,17.25zM20.71,7.04c0.39,-0.39 0.39,-1.02 0,-1.41l-2.34,-2.34c-0.39,-0.39 -1.02,-0.39 -1.41,0l-1.83,1.83 3.75,3.75 1.83,-1.83z",
              "ic_cut": "M9.64,7.64c0.23,-0.5 0.36,-1.05 0.36,-1.64 0,-2.21 -1.79,-4 -4,-4S2,3.79 2,6s1.79,4 4,4c0.59,0 1.14,-0.13 1.64,-0.36L10,12l-2.36,2.36C7.14,14.13 6.59,14 6,14c-2.21,0 -4,1.79 -4,4s1.79,4 4,4 4,-1.79 4,-4c0,-0.59 -0.13,-1.14 -0.36,-1.64L12,14l7,7h3v-1L9.64,7.64z",
              "ic_select_up": "M4,12l1.41,1.41L11,7.83V20h2V7.83l5.58,5.59L20,12l-8,-8 -8,8z",
              "ic_select_down": "M20,12l-1.41,-1.41L13,16.17V4h-2v12.17l-5.58,-5.59L4,12l8,8 8,-8z",
              "ic_datetime": "M11.99,2C6.47,2 2,6.48 2,12s4.47,10 9.99,10C17.52,22 22,17.52 22,12S17.52,2 11.99,2zM12,20c-4.42,0 -8,-3.58 -8,-8s3.58,-8 8,-8 8,3.58 8,8 -3.58,8 -8,8zm0.5,-13H11v6l5.25,3.15 0.75,-1.23 -4.5,-2.67z",
              "ic_find_replace": "M15.5,14h-0.79l-0.28,-0.27C15.41,12.59 16,11.11 16,9.5 16,5.91 13.09,3 9.5,3S3,5.91 3,9.5 5.91,16 9.5,16c1.61,0 3.09,-0.59 4.23,-1.57l0.27,0.28v0.79l5,4.99L20.49,19l-4.99,-5zm-6,0C7.01,14 5,11.99 5,9.5S7.01,5 9.5,5 14,7.01 14,9.5 11.99,14 9.5,14z",
              "ic_jump_vertical": "M16,17.01V10h-2v7.01h-3L15,21l4,-3.99h-3zM9,3L5,6.99h3V14h2V6.99h3L9,3z"
          }
          for name, path in icons.items():
              xml = f'''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="{path}"/>
          </vector>'''
              with open(f"app/src/main/res/drawable/{name}.xml", "w", encoding="utf-8") as f:
                  f.write(xml)
          EOF

      - name: Download 12 Embedded Arabic Fonts into res/font
        run: |
          python3 - << 'EOF'
          import urllib.request
          import os

          fonts = {
              "tajawal_regular.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf",
              "tajawal_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf",
              "mazwd_arabic.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Regular.ttf",
              "mazwd_arabic_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Bold.ttf",
              "scheherazade_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/scheherazadenew/ScheherazadeNew-Bold.ttf",
              "readex_pro.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/readexpro/ReadexPro%5BHEXP%2Cwght%5D.ttf",
              "readex_pro_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/readexpro/ReadexPro%5BHEXP%2Cwght%5D.ttf",
              "noto_sans_arabic.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf",
              "noto_sans_arabic_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf",
              "noto_naskh_arabic.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf",
              "noto_naskh_arabic_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf",
              "ibm_plex_arabic.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf",
              "ibm_plex_arabic_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Bold.ttf",
              "aref_ruqaa.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Regular.ttf",
              "aref_ruqaa_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf",
              "reem_kufi.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/reemkufi/ReemKufi%5Bwght%5D.ttf",
              "reem_kufi_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/reemkufi/ReemKufi%5Bwght%5D.ttf",
          }

          out_dir = "app/src/main/res/font"
          os.makedirs(out_dir, exist_ok=True)
          for fname, url in fonts.items():
              dest = os.path.join(out_dir, fname)
              try:
                  urllib.request.urlretrieve(url, dest)
                  print(f"Downloaded {fname}")
              except Exception as e:
                  print(f"Warning: Could not download {fname}: {e}")
          EOF

      - name: Assemble & Verify MainActivity.java from 5 Parts
        run: |
          if [ -f MainActivity_01_core.java ]; then
            cat MainActivity_01_core.java \
                MainActivity_02_storage.java \
                MainActivity_03_home.java \
                MainActivity_04_document.java \
                MainActivity_05_settings.java \
                > app/src/main/java/com/mazwd/app/MainActivity.java
          elif [ -f MainActivity.java ]; then
            cp MainActivity.java app/src/main/java/com/mazwd/app/MainActivity.java
          else
            echo "❌ لم يتم العثور على ملفات الكود الخمسة في جذر المستودع"
            exit 1
          fi

          sed -i '/^\x60/d' app/src/main/java/com/mazwd/app/MainActivity.java

          python3 - << 'EOF'
          import re
          src = open("app/src/main/java/com/mazwd/app/MainActivity.java", encoding="utf-8").read()
          assert src.count("package com.mazwd.app;") == 1, "خطأ: تكرار جملة package"
          assert src.count("public class MainActivity") == 1, "خطأ: تكرار تعريف الكلاس"
          stripped = re.sub(r'"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'|//[^\n]*|/\*.*?\*/', '', src, flags=re.S)
          bal = 0
          for ch in stripped:
              if ch == '{': bal += 1
              elif ch == '}': bal -= 1
              assert bal >= 0, "خطأ: قوس إغلاق زائد في الكود"
          assert bal == 0, f"خطأ: الأقواس غير متوازنة ({bal})"
          print("✅ تم دمج الأجزاء الخمسة والتحقق من سلامة الكود بنجاح 100%")
          EOF

      - name: Build Signed Release APK with Gradle 8.2.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'
          arguments: assembleRelease --stacktrace

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wasm-Notepad-v2.7.1-Signed-APK
          path: app/build/outputs/apk/release/*.apk
