name: Build Wasm (Mazwd) Notepad APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Fixed Signing Keystore from Cache
        uses: actions/cache@v4
        with:
          path: ~/.android/mazwd_fixed.keystore
          key: mazwd-fixed-signing-keystore-permanent-v1

      - name: Ensure Fixed Signing Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/mazwd_fixed.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/mazwd_fixed.keystore \
              -alias mazwd_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mazwd123456 \
              -keypass mazwd123456 \
              -dname "CN=Wasm Notepad, OU=Mobile, O=Mazwd, L=Riyadh, S=Riyadh, C=SA"
          fi

      - name: Create Android Project Skeleton & Resources
        run: |
          mkdir -p app/src/main/java/com/mazwd/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/font
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          rootProject.name = "WasmNotepad"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "com.mazwd.app"
              compileSdk 34

              defaultConfig {
                  applicationId "com.mazwd.app"
                  minSdk 27
                  targetSdk 34
                  versionCode 271
                  versionName "2.7.1"
              }

              signingConfigs {
                  release {
                      storeFile file("${System.getProperty('user.home')}/.android/mazwd_fixed.keystore")
                      storePassword "mazwd123456"
                      keyAlias "mazwd_key"
                      keyPassword "mazwd123456"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mazwd.app">

              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:label="وسم"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # أيقونة التطبيق الفاخرة المعتمدة (app_icon.xml)
          cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#1E3A8A"
                  android:pathData="M18,16h72c4.4,0 8,3.6 8,8v60c0,4.4 -3.6,8 -8,8H18c-4.4,0 -8,-3.6 -8,-8V24C10,19.6 13.6,16 18,16z" />
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M18,16h72c4.4,0 8,3.6 8,8v8H10v-8C10,19.6 13.6,16 18,16z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,44h44v3.5H24zM24,56h38v3.5H24zM24,68h30v3.5H24z" />
              <path
                  android:fillColor="#FBBF24"
                  android:pathData="M78,38l8,8l-24,24l-10,2l2,-10z" />
              <path
                  android:fillColor="#FDE68A"
                  android:pathData="M80,36l6,6l-3,3l-6,-6z" />
          </vector>
          EOF

      - name: Download 12 Embedded Arabic Fonts into res/font
        run: |
          python3 - << 'EOF'
          import urllib.request
          import os

          fonts = {
              "tajawal_regular.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf",
              "tajawal_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf",
              "mazwd_arabic.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Regular.ttf",
              "mazwd_arabic_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Bold.ttf",
              "scheherazade_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/scheherazadenew/ScheherazadeNew-Bold.ttf",
              "readex_pro.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/readexpro/ReadexPro%5BHEXP%2Cwght%5D.ttf",
              "readex_pro_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/readexpro/ReadexPro%5BHEXP%2Cwght%5D.ttf",
              "noto_sans_arabic.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf",
              "noto_sans_arabic_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf",
              "noto_naskh_arabic.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf",
              "noto_naskh_arabic_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf",
              "ibm_plex_arabic.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf",
              "ibm_plex_arabic_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-Bold.ttf",
              "aref_ruqaa.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Regular.ttf",
              "aref_ruqaa_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf",
              "reem_kufi.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/reemkufi/ReemKufi%5Bwght%5D.ttf",
              "reem_kufi_bold.ttf": "https://raw.githubusercontent.com/google/fonts/main/ofl/reemkufi/ReemKufi%5Bwght%5D.ttf",
          }

          out_dir = "app/src/main/res/font"
          os.makedirs(out_dir, exist_ok=True)
          for fname, url in fonts.items():
              dest = os.path.join(out_dir, fname)
              try:
                  urllib.request.urlretrieve(url, dest)
                  print(f"Downloaded {fname}")
              except Exception as e:
                  print(f"Warning: Could not download {fname}: {e}")
          EOF

      - name: Assemble & Verify MainActivity.java from 5 Parts
        run: |
          if [ -f MainActivity_01_core.java ]; then
            cat MainActivity_01_core.java \
                MainActivity_02_storage.java \
                MainActivity_03_home.java \
                MainActivity_04_document.java \
                MainActivity_05_settings.java \
                > app/src/main/java/com/mazwd/app/MainActivity.java
          elif [ -f MainActivity.java ]; then
            cp MainActivity.java app/src/main/java/com/mazwd/app/MainActivity.java
          else
            echo "❌ لم يتم العثور على ملفات الكود في المستودع"
            exit 1
          fi

          # إزالة أي علامات اقتباس برمجية زائدة إن وجدت
          sed -i '/^\x60/d' app/src/main/java/com/mazwd/app/MainActivity.java

          # فحص آلي لتوازن الأقواس وسلامة الدمج
          python3 - << 'EOF'
          import re
          src = open("app/src/main/java/com/mazwd/app/MainActivity.java", encoding="utf-8").read()
          assert src.count("package com.mazwd.app;") == 1, "خطأ: تكرار جملة package"
          assert src.count("public class MainActivity") == 1, "خطأ: تكرار تعريف الكلاس"
          stripped = re.sub(r'"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'|//[^\n]*|/\*.*?\*/', '', src, flags=re.S)
          bal = 0
          for ch in stripped:
              if ch == '{': bal += 1
              elif ch == '}': bal -= 1
              assert bal >= 0, "خطأ: قوس إغلاق زائد في الكود"
          assert bal == 0, f"خطأ: الأقواس غير متوازنة ({bal})"
          print("✅ تم دمج الأجزاء الخمسة والتحقق من سلامة الكود بنجاح 100%")
          EOF

      - name: Build Signed Release APK with Gradle 8.2.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'
          arguments: assembleRelease --stacktrace

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wasm-Notepad-v2.7.1-Signed-APK
          path: app/build/outputs/apk/release/*.apk
